syntax = "proto3";

package restaurant;

option go_package = "example.com/restaurant-service/pb";

// RestaurantService — gRPC-транспорт сервиса «Рестораны» (вариант 5).
service RestaurantService {
  rpc Create(CreateRequest) returns (CreateReply);
  rpc GetByID(GetByIDRequest) returns (GetByIDReply);
  rpc ChangeRating(ChangeRatingRequest) returns (ChangeRatingReply);
}

message Restaurant {
  string id = 1;
  string name = 2;
  string address = 3;
  float rating = 4;
  bool open = 5;
}

message CreateRequest {
  Restaurant restaurant = 1;
}

message CreateReply {
  string id = 1;
  string error = 2;
}

message GetByIDRequest {
  string id = 1;
}

message GetByIDReply {
  Restaurant restaurant = 1;
  string error = 2;
}

message ChangeRatingRequest {
  string id = 1;
  float rating = 2;
}

message ChangeRatingReply {
  string error = 1;
}
