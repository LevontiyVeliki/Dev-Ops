name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Образ публикуется в GitHub Container Registry (ghcr.io) вместо Docker Hub:
# вход выполняется встроенным GITHUB_TOKEN, отдельный аккаунт и секреты
# не нужны. Имя образа: ghcr.io/<владелец>/restaurant-service.
env:
  REGISTRY: ghcr.io
  IMAGE: restaurant-service

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lab6/restaurant-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверка образа: запускаем контейнер и делаем запросы curl
      - name: Smoke test container
        run: |
          docker build -t restaurant-service:test lab6/restaurant-service
          docker run -d --name rs -p 8080:8080 -p 9090:9090 restaurant-service:test
          sleep 2
          ID=$(curl -s -X POST localhost:8080/restaurants -d '{"name":"CI","rating":4}' | cut -d'"' -f4)
          curl -sf localhost:8080/restaurants/$ID
          docker logs rs
